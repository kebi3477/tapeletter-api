# 이미 443을 쓰는 리버스 프록시(Caddy·nginx 등) 뒤에 붙일 때 쓰는 입구.
# 미니PC에서는 myhandball Caddy가 tapeletter.lab241.com을 이 컨테이너(cassette-edge:80)로 넘긴다.
#
# 사용: docker compose -f docker-compose.yml -f docker-compose.edge.yml --env-file .env.production up -d --build
# EDGE_NETWORK: 앞단 프록시 컨테이너가 있는 도커 네트워크 (미니PC: myhandball_default)
services:
  edge:
    image: caddy:2-alpine
    container_name: cassette-edge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      S3_BUCKET: ${S3_BUCKET:-cassette}
      # 접속 로그 보관 일수 (Caddyfile의 roll_keep_for). api의 요청 기록과 같은 값
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - ./ops/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      # 접속 로그 (JSON, 하루 롤링). 백업 대상이 아니다. 조회: ops/logs/logs.sh edge
      - edge-logs:/var/log/caddy
      # 소개 사이트 (루트 도메인 /)
      - ./ops/edge/site:/srv/site:ro
    networks:
      default: {}
      proxy:
        aliases:
          - cassette-edge
    depends_on:
      api:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  edge-logs:

networks:
  proxy:
    name: ${EDGE_NETWORK:?EDGE_NETWORK(앞단 프록시의 도커 네트워크)를 정해 주세요}
    external: true
