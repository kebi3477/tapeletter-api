# 미니PC 운영용. 자세한 설치·배포·백업·복원은 docs/deploy.md
# 사용: cp .env.example .env.production && (값 채우기)
#       docker compose --env-file .env.production up -d --build
# .env.production 하나에 compose 변수(POSTGRES_*, S3_ROOT_*, OFFSITE_* 등)와 앱 변수를 함께 둔다.
# 호스트의 포트는 127.0.0.1에만 묶는다. 외부 공개는 둘 중 하나를 덧붙여 쓴다:
#   - docker-compose.edge.yml   이미 443을 쓰는 리버스 프록시 뒤 (미니PC: myhandball Caddy)
#   - docker-compose.tunnel.yml Cloudflare Tunnel (도메인이 Cloudflare에 있을 때)
name: cassette

# 모든 서비스 공통: 로그 파일 크기 제한 (10MB × 5개)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cassette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 정해 주세요}
      POSTGRES_DB: ${POSTGRES_DB:-cassette}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 녹음 파일 저장소: SeaweedFS (S3 호환). MinIO는 커뮤니티 도커 이미지 배포를 멈춰서 바꿨다 (2026-09)
  # S3 API는 9000. 자격 증명은 S3_ROOT_USER / S3_ROOT_PASSWORD로 시작할 때 s3.json을 만든다
  s3:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    logging: *logging
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"cassette","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ROOT_USER" "$$S3_ROOT_PASSWORD" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ROOT_USER: ${S3_ROOT_USER:-cassette}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD를 정해 주세요}
    volumes:
      - s3-data:/data
    networks:
      default:
        aliases:
          - cassette-s3
    # S3 API(9000)는 입구(edge 또는 cloudflared)가 공개한다. 호스트에는 127.0.0.1로만
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: .env.production
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-cassette}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cassette}
      REDIS_URL: redis://redis:6379
      # 녹음 파일. 앱은 presigned URL로 저장소(s3)에 직접 올리고 받는다.
      # S3_PUBLIC_ENDPOINT는 s3:9000을 공개한 주소 (edge: https://<도메인>, 버킷 경로로 구분 · tunnel: https://files.<도메인>)
      STORAGE_DRIVER: s3
      FFMPEG_MODE: real
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT를 정해 주세요}
      S3_ACCESS_KEY: ${S3_ROOT_USER:-cassette}
      S3_SECRET_KEY: ${S3_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-cassette}
      S3_CREATE_BUCKET: "true"
    # DB·Redis·저장소가 healthy가 된 뒤에 시작한다 (시작할 때 마이그레이션을 적용한다)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    networks:
      default:
        aliases:
          - cassette-api
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  # 매일 Postgres 백업 (pg_dump -Fc, 최근 BACKUP_KEEP개 보관)
  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/ops/backup/cron.sh"]
    environment:
      CRON_SCHEDULE: ${PG_BACKUP_CRON:-0 19 * * *} # UTC 19:00 = 한국 04:00
      JOB: /bin/sh /ops/backup/pg-backup.sh
      BACKUP_KEEP: ${PG_BACKUP_KEEP:-14}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-cassette}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-cassette}
    volumes:
      - ./ops/backup:/ops/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 60s
      timeout: 3s
      retries: 3

  # 매일 외부 저장소로 복제: 녹음 파일 버킷 + Postgres 백업 파일 (Cloudflare R2 / Backblaze B2 등 S3 호환)
  offsite-backup:
    image: rclone/rclone:latest
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/ops/backup/cron.sh"]
    environment:
      CRON_SCHEDULE: ${OFFSITE_BACKUP_CRON:-30 19 * * *} # UTC 19:30 = 한국 04:30 (pg 백업 뒤)
      JOB: /bin/sh /ops/backup/offsite.sh
      S3_BUCKET: ${S3_BUCKET:-cassette}
      OFFSITE_BUCKET: ${OFFSITE_BUCKET:-}
      OFFSITE_POSTGRES_RETENTION: ${OFFSITE_POSTGRES_RETENTION:-30d}
      OFFSITE_DELETED_RETENTION: ${OFFSITE_DELETED_RETENTION:-30d}
      # rclone 리모트 "store": 이 미니PC의 저장소(SeaweedFS)
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: SeaweedFS
      RCLONE_CONFIG_STORE_ENDPOINT: http://s3:9000
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${S3_ROOT_USER:-cassette}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD}
      # rclone 리모트 "offsite": 외부 저장소 (R2: provider Cloudflare, B2: provider Other)
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - ./ops/backup:/ops/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 60s
      timeout: 3s
      retries: 3

  # 매일 외장하드로 복제: 녹음 파일 버킷 + DB 백업 파일 (EXTERNAL_BACKUP_DIR, 미니PC는 /mnt/backup)
  # 외장하드 안에 tapeletter-backup/.target 표식이 있을 때만 돈다 (빠져 있으면 내장 저장소에 쌓지 않게)
  external-backup:
    image: rclone/rclone:latest
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/ops/backup/cron.sh"]
    environment:
      CRON_SCHEDULE: ${EXTERNAL_BACKUP_CRON:-0 20 * * *} # UTC 20:00 = 한국 05:00 (pg 백업 뒤)
      JOB: /bin/sh /ops/backup/external.sh
      S3_BUCKET: ${S3_BUCKET:-cassette}
      EXTERNAL_POSTGRES_RETENTION: ${EXTERNAL_POSTGRES_RETENTION:-90d}
      EXTERNAL_DELETED_RETENTION: ${EXTERNAL_DELETED_RETENTION:-90d}
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: SeaweedFS
      RCLONE_CONFIG_STORE_ENDPOINT: http://s3:9000
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${S3_ROOT_USER:-cassette}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD}
    volumes:
      - ./ops/backup:/ops/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - ${EXTERNAL_BACKUP_DIR:-./backups-external}:/external
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 60s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  s3-data:
